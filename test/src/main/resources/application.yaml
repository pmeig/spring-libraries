spring:
  application:
    name: test
  logger:
    pmeig:
      correlation:
        request: correlationId
  security:
    pmeig:
      auth:
        type:
          - jwt

test:
  log: myLog

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} %X{test.property} - %msg%n"
